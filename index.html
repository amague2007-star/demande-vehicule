<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande de Sortie Véhicule</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 15px;
               box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
  header { background: #1e3c72; color: #fff; padding: 25px; text-align: center; }
  header h1 { font-size: 24px; }
  header p { font-size: 14px; opacity: 0.85; margin-top: 5px; }
  .tabs { display: flex; background: #f0f2f5; }
  .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 600;
         color: #666; border-bottom: 3px solid transparent; transition: 0.2s; }
  .tab.active { color: #1e3c72; border-bottom-color: #1e3c72; background: #fff; }
  .content { padding: 30px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-weight: 600; margin-bottom: 6px; color: #333; font-size: 14px; }
  label .required { color: #e74c3c; }
  input, select, textarea {
    padding: 11px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
    font-size: 14px; transition: 0.2s; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42,82,152,0.15); }
  textarea { resize: vertical; min-height: 80px; }
  .btn { padding: 13px 25px; border: none; border-radius: 8px; cursor: pointer;
         font-size: 15px; font-weight: 600; transition: 0.2s; }
  .btn-primary { background: #1e3c72; color: #fff; width: 100%; margin-top: 20px; }
  .btn-primary:hover { background: #2a5298; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(30,60,114,0.3); }
  .btn-primary:disabled { background: #95a5a6; cursor: not-allowed; transform: none; }
  .btn-danger { background: #e74c3c; color: #fff; padding: 6px 12px; font-size: 12px; }
  .btn-danger:hover { background: #c0392b; }
  .btn-print { background: #27ae60; color: #fff; padding: 6px 12px; font-size: 12px; margin-right: 5px; }
  .btn-print:hover { background: #229954; }

  .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 600; }
  .message.success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; display: block; }
  .message.error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; display: block; }

  .demandes-list { display: flex; flex-direction: column; gap: 15px; }
  .demande-card {
    background: #f8f9fb; border-left: 5px solid #1e3c72; border-radius: 8px;
    padding: 18px; display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .demande-info h3 { color: #1e3c72; font-size: 16px; margin-bottom: 5px; }
  .demande-info p { font-size: 13px; color: #555; line-height: 1.6; }
  .demande-info .badge {
    display: inline-block; background: #1e3c72; color: #fff;
    padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 5px;
  }
  .demande-actions { display: flex; gap: 5px; }
  .empty { text-align: center; color: #999; padding: 40px; font-style: italic; }

  .loader {
    display: none; text-align: center; padding: 15px;
    color: #1e3c72; font-weight: 600;
  }
  .loader.active { display: block; }

  @media print {
    body { background: #fff; padding: 0; }
    .tabs, .btn, .demande-actions, header p { display: none !important; }
    .container { box-shadow: none; }
  }
  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚗 Gestion des Sorties de Véhicules</h1>
    <p>Système de demande et suivi logistique</p>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('form', event)">📝 Nouvelle Demande</div>
    <div class="tab" onclick="switchTab('list', event)">📋 Mon Historique Local</div>
  </div>

  <div class="content">

    <div id="messageBox" class="message"></div>

    <!-- FORMULAIRE -->
    <form id="formDemande" onsubmit="soumettre(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>Nom <span class="required">*</span></label>
          <input type="text" id="nom" name="nom" required placeholder="Ex: DUPONT">
        </div>
        <div class="form-group">
          <label>Prénom <span class="required">*</span></label>
          <input type="text" id="prenom" name="prenom" required placeholder="Ex: Jean">
        </div>

        <div class="form-group">
          <label>Poste occupé <span class="required">*</span></label>
          <input type="text" id="poste" name="poste" required placeholder="Ex: Chauffeur, Technicien...">
        </div>
        <div class="form-group">
          <label>Service / Département</label>
          <input type="text" id="service" name="service" placeholder="Ex: Logistique">
        </div>

        <div class="form-group">
          <label>Email de l'agent <span class="required">*</span></label>
          <input type="email" id="email" name="email" required placeholder="Ex: agent@exemple.com">
        </div>
        <div class="form-group">
          <label>Contact (téléphone)</label>
          <input type="tel" id="contact" name="contact" placeholder="Ex: +227 90 00 00 00">
        </div>

        <div class="form-group">
          <label>Date de sortie <span class="required">*</span></label>
          <input type="date" id="dateSortie" name="dateSortie" required>
        </div>
        <div class="form-group">
          <label>Heure de départ <span class="required">*</span></label>
          <input type="time" id="heureDepart" name="heureDepart" required>
        </div>

        <div class="form-group">
          <label>Destination <span class="required">*</span></label>
          <input type="text" id="destination" name="destination" required placeholder="Ex: Marché central">
        </div>
        <div class="form-group">
          <label>Durée estimée (minutes) <span class="required">*</span></label>
          <input type="number" id="duree" name="duree" required min="1" placeholder="Ex: 120">
        </div>

        <div class="form-group">
          <label>Véhicule souhaité / Type</label>
          <input type="text" id="vehicule" name="vehicule" placeholder="Ex: Camionnette, 4x4...">
        </div>
        <div class="form-group">
          <label>Nombre de passagers</label>
          <input type="number" id="passagers" name="passagers" min="1" placeholder="Ex: 3">
        </div>

        <div class="form-group full">
          <label>Motif / Objet de la sortie <span class="required">*</span></label>
          <textarea id="motif" name="motif" required placeholder="Précisez la raison de la sortie..."></textarea>
        </div>

        <div class="form-group full">
          <label>Nom du responsable à valider</label>
          <input type="text" id="responsable" name="responsable" placeholder="Ex: M. le Directeur Logistique">
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary">✅ Envoyer la demande</button>
      <div id="loader" class="loader">⏳ Envoi de la demande en cours...</div>
    </form>

    <!-- LISTE -->
    <div id="listContainer" style="display:none;">
      <div id="demandesList" class="demandes-list"></div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // maenbwev
  // ============================================================
  const FORMSPREE_URL = "https://formspree.io/f/maenbwev";
  // ============================================================

  const STORAGE_KEY = 'demandes_sorties';

  // Initialiser la date du jour
  document.getElementById('dateSortie').valueAsDate = new Date();

  // Navigation onglets
  function switchTab(tab, event) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('formDemande').style.display = tab === 'form' ? 'grid' : 'none';
    document.getElementById('listContainer').style.display = tab === 'list' ? 'block' : 'none';
    if (tab === 'list') afficherDemandes();
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  function afficherMessage(texte, type) {
    const box = document.getElementById('messageBox');
    box.className = 'message ' + type;
    box.textContent = texte;
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (type === 'success') {
      setTimeout(() => { box.className = 'message'; }, 8000);
    }
  }

  // Soumission du formulaire
  async function soumettre(e) {
    e.preventDefault();

    const btn = document.getElementById('btnSubmit');
    const loader = document.getElementById('loader');

    // Vérifier que l'URL Formspree est configurée
    if (FORMSPREE_URL.includes('VOTRE_CODE_FORMSPREE')) {
      afficherMessage("⚠️ Configuration manquante : Le code Formspree n'a pas été remplacé dans le fichier. Contactez l'administrateur.", 'error');
      return;
    }

    // Construire l'objet demande
    const demande = {
      id: Date.now(),
      nom: val('nom'),
      prenom: val('prenom'),
      poste: val('poste'),
      service: val('service'),
      email: val('email'),
      contact: val('contact'),
      dateSortie: val('dateSortie'),
      heureDepart: val('heureDepart'),
      destination: val('destination'),
      duree: val('duree'),
      vehicule: val('vehicule'),
      passagers: val('passagers'),
      motif: val('motif'),
      responsable: val('responsable'),
      dateCreation: new Date().toLocaleString('fr-FR')
    };

    // Afficher le loader, désactiver le bouton
    btn.disabled = true;
    btn.textContent = '⏳ Envoi en cours...';
    loader.classList.add('active');

    try {
      // Envoi à Formspree
      const response = await fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          _subject: `🚗 Nouvelle demande de sortie - ${demande.prenom} ${demande.nom}`,
          _replyto: demande.email,
          "Nom": demande.nom,
          "Prénom": demande.prenom,
          "Poste occupé": demande.poste,
          "Service": demande.service,
          "Email agent": demande.email,
          "Contact": demande.contact,
          "Date de sortie": demande.dateSortie,
          "Heure de départ": demande.heureDepart,
          "Destination": demande.destination,
          "Durée estimée (min)": demande.duree,
          "Véhicule souhaité": demande.vehicule,
          "Nombre de passagers": demande.passagers,
          "Motif": demande.motif,
          "Responsable à valider": demande.responsable,
          "Date de création": demande.dateCreation
        })
      });

      if (!response.ok) {
        throw new Error('Erreur serveur : ' + response.status);
      }

      // Sauvegarder localement dans l'historique
      const demandes = getDemandes();
      demandes.unshift(demande);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(demandes));

      // Message de succès
      afficherMessage('✅ Votre demande a été envoyée avec succès au service Logistique. Vous recevrez une confirmation par email.', 'success');

      // Réinitialiser
      e.target.reset();
      document.getElementById('dateSortie').valueAsDate = new Date();

    } catch (err) {
      afficherMessage("❌ Erreur lors de l'envoi : " + err.message + ". Vérifiez votre connexion internet et réessayez.", 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '✅ Envoyer la demande';
      loader.classList.remove('active');
    }
  }

  function getDemandes() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }

  // Affichage
  function afficherDemandes() {
    const demandes = getDemandes();
    const container = document.getElementById('demandesList');

    if (demandes.length === 0) {
      container.innerHTML = '<div class="empty">📭 Aucune demande enregistrée localement sur cet appareil</div>';
      return;
    }

    container.innerHTML = demandes.map(d => `
      <div class="demande-card">
        <div class="demande-info">
          <h3>${d.prenom} ${d.nom} <span class="badge">${d.poste}</span></h3>
          <p>
            📅 <strong>${formatDate(d.dateSortie)}</strong> à <strong>${d.heureDepart}</strong>
            &nbsp;|&nbsp; 📍 ${d.destination}
            &nbsp;|&nbsp; ⏱ ${d.duree} min<br>
            🚗 ${d.vehicule || 'N/A'} &nbsp;|&nbsp; 👥 ${d.passagers || 'N/A'} passager(s)
            &nbsp;|&nbsp; 📞 ${d.contact || 'N/A'}<br>
            📝 ${d.motif}
          </p>
        </div>
        <div class="demande-actions">
          <button class="btn btn-print" onclick="imprimer(${d.id})">🖨️</button>
          <button class="btn btn-danger" onclick="supprimer(${d.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function supprimer(id) {
    if (!confirm('Supprimer cette demande de votre historique local ?')) return;
    const demandes = getDemandes().filter(d => d.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(demandes));
    afficherDemandes();
  }

  // Impression d'un bon de sortie
  function imprimer(id) {
    const d = getDemandes().find(x => x.id === id);
    if (!d) return;

    const w = window.open('', '_blank');
    w.document.write(`
      <html><head><title>Bon de Sortie</title>
      <style>
        body { font-family: Arial; padding: 40px; max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #1e3c72; border-bottom: 3px solid #1e3c72; padding-bottom: 10px; }
        .info { margin: 20px 0; }
        .row { display: flex; padding: 8px 0; border-bottom: 1px dashed #ccc; }
        .label { font-weight: bold; width: 220px; color: #333; }
        .signature { display: flex; justify-content: space-between; margin-top: 60px; }
        .signature div { width: 45%; text-align: center; border-top: 1px solid #000; padding-top: 8px; }
      </style></head><body>
      <h1>BON DE SORTIE VÉHICULE</h1>
      <p style="text-align:right;">N° ${d.id}</p>
      <div class="info">
        <div class="row"><span class="label">Nom & Prénom :</span> ${d.prenom} ${d.nom}</div>
        <div class="row"><span class="label">Poste occupé :</span> ${d.poste}</div>
        <div class="row"><span class="label">Service :</span> ${d.service || 'N/A'}</div>
        <div class="row"><span class="label">Destination :</span> ${d.destination}</div>
        <div class="row"><span class="label">Date de sortie :</span> ${formatDate(d.dateSortie)}</div>
        <div class="row"><span class="label">Heure de départ :</span> ${d.heureDepart}</div>
        <div class="row"><span class="label">Durée estimée :</span> ${d.duree} minutes</div>
        <div class="row"><span class="label">Véhicule :</span> ${d.vehicule || 'N/A'}</div>
        <div class="row"><span class="label">Passagers :</span> ${d.passagers || 'N/A'}</div>
        <div class="row"><span class="label">Motif :</span> ${d.motif}</div>
        <div class="row"><span class="label">Contact :</span> ${d.contact || 'N/A'}</div>
        <div class="row"><span class="label">Email :</span> ${d.email || 'N/A'}</div>
      </div>
      <div class="signature">
        <div>Signature Agent<br><br>${d.prenom} ${d.nom}</div>
        <div>Visa Responsable<br><br>${d.responsable || ''}</div>
      </div>
      <p style="text-align:center; margin-top:40px; font-size:12px; color:#666;">
        Demande créée le ${d.dateCreation}
      </p>
      <script>window.print();<\/script>
      </body></html>
    `);
    w.document.close();
  }
</script>
</body>
</html>
