
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>ADKOUL - Administration</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e3c72, #2563eb);
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  background: white;
  padding: 35px;
  border-radius: 15px;
  width: 390px;
  max-width: 92%;
  box-shadow: 0 12px 30px rgba(0,0,0,.2);
}

h2 {
  color: #1e3c72;
  text-align: center;
}

label {
  display: block;
  margin: 14px 0 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 8px;
  margin-top: 20px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#message {
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}

#dashboard {
  display: none;
  text-align: center;
}

.logout {
  background: #dc2626;
}

.retour {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #1e3c72;
}
</style>
</head>

<body>

<section class="box" id="loginBox">

  <h2>Administration ADKOUL</h2>

  <form id="loginForm">

    <label for="email">Adresse e-mail</label>

    <input
      type="email"
      id="email"
      value="abdoul.aziz@adkoul.org"
      autocomplete="username"
      required
    >

    <label for="password">Mot de passe</label>

    <input
      type="password"
      id="password"
      placeholder="Mot de passe Supabase Auth"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="btnLogin">
      Se connecter
    </button>

  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <a href="index.html" class="retour">
    Retour à l'accueil
  </a>

</section>

<section class="box" id="dashboard">

  <h2>Bienvenue sur ADKOUL</h2>

  <p>
    Utilisateur :
    <strong id="nomUser"></strong>
  </p>

  <p>
    Rôle :
    <strong id="roleUser"></strong>
  </p>

  <p>Session authentifiée avec Supabase.</p>

  <button type="button" class="logout" id="btnLogout">
    Se déconnecter
  </button>

  <a href="index.html" class="retour">
    Accueil
  </a>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
"use strict";

// CONFIGURATION SUPABASE

const SUPABASE_URL =
  "https://mvmzhdvkeromtljnvrow.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

// COMPTE AUTORISE POUR CETTE PAGE

const EMAIL_AUTORISE =
  "abdoul.aziz@adkoul.org";

// ROLES EXISTANTS DANS LA BASE

const ROLES_RECONNUS = new Set([
  "rh",
  "directeur_logistique",
  "logistique",
  "assistant_logistique"
]);

const client = window.supabase
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    )
  : null;

const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const message =
  document.getElementById("message");

const btnLogin =
  document.getElementById("btnLogin");

// AFFICHAGE DES MESSAGES

function afficherMessage(texte, erreur = false) {
  message.textContent = texte;
  message.style.color = erreur ? "#dc2626" : "#1e3c72";
}

// AFFICHAGE DU TABLEAU DE CONNEXION

function afficherDashboard(profil, utilisateur) {

  document.getElementById("nomUser").textContent =
    profil.nom || utilisateur.email;

  document.getElementById("roleUser").textContent =
    profil.role;

  loginBox.style.display = "none";
  dashboard.style.display = "block";
}

// AFFICHAGE DU FORMULAIRE

function afficherConnexion() {
  dashboard.style.display = "none";
  loginBox.style.display = "block";
}

// VERIFICATION DU PROFIL

async function verifierProfil(utilisateur) {

  if (!utilisateur || !utilisateur.email) {
    return null;
  }

  const email =
    utilisateur.email.trim().toLowerCase();

  if (email !== EMAIL_AUTORISE) {
    return null;
  }

  const { data, error } = await client
    .from("admins")
    .select("nom, role")
    .ilike("email", email)
    .maybeSingle();

  if (error || !data) {
    return null;
  }

  const role =
    String(data.role || "").trim().toLowerCase();

  if (!ROLES_RECONNUS.has(role)) {
    return null;
  }

  return data;
}

// CONNEXION

async function seConnecter(event) {

  event.preventDefault();

  if (!client) {
    afficherMessage(
      "Bibliothèque Supabase indisponible.",
      true
    );
    return;
  }

  const email = document
    .getElementById("email")
    .value.trim().toLowerCase();

  const password = document
    .getElementById("password")
    .value;

  if (email !== EMAIL_AUTORISE) {
    afficherMessage(
      "Adresse e-mail non autorisée.",
      true
    );
    return;
  }

  btnLogin.disabled = true;

  afficherMessage("Vérification en cours...");

  try {

    const { data, error } =
      await client.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error || !data.user) {
      afficherMessage(
        "Identifiants incorrects ou compte non activé.",
        true
      );
      return;
    }

    const profil =
      await verifierProfil(data.user);

    if (!profil) {

      await client.auth.signOut();

      afficherMessage(
        "Accès refusé : profil non autorisé.",
        true
      );

      return;
    }

    document.getElementById("password").value = "";

    afficherMessage("");

    afficherDashboard(profil, data.user);

  } catch (error) {

    await client.auth.signOut().catch(() => {});

    afficherMessage(
      "Erreur de connexion ou de vérification.",
      true
    );

  } finally {

    btnLogin.disabled = false;

  }
}

// VERIFICATION DE SESSION

async function verifierSession() {

  if (!client) {
    afficherMessage(
      "Service Supabase indisponible.",
      true
    );
    btnLogin.disabled = true;
    return;
  }

  try {

    const { data, error } =
      await client.auth.getUser();

    if (error || !data.user) {
      afficherConnexion();
      return;
    }

    const profil =
      await verifierProfil(data.user);

    if (!profil) {

      await client.auth.signOut();

      afficherConnexion();
      return;
    }

    afficherDashboard(profil, data.user);

  } catch (error) {

    afficherConnexion();

    afficherMessage(
      "Vérification de session impossible.",
      true
    );
  }
}

// DECONNEXION

async function seDeconnecter() {

  if (client) {

    const { error } =
      await client.auth.signOut();

    if (error) {
      afficherMessage(
        "Déconnexion impossible.",
        true
      );
      return;
    }
  }

  afficherConnexion();

  document.getElementById("password").value = "";

  afficherMessage("Session terminée.");
}

// EVENEMENTS

document
  .getElementById("loginForm")
  .addEventListener("submit", seConnecter);

document
  .getElementById("btnLogout")
  .addEventListener("click", seDeconnecter);

// INITIALISATION

verifierSession();

</script>

</body>
</html>
