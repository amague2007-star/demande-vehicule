<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin - Connexion</title>
<style>
  body { font-family: Arial; background: #1e3c72; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: white; padding: 40px; border-radius: 15px; width: 350px; }
  h2 { color: #1e3c72; text-align: center; }
  input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  #message { margin-top: 15px; text-align: center; font-weight: bold; }
  #dashboardTest { display: none; text-align: center; }
</style>
</head>
<body>

<div class="box" id="loginBox">
  <h2>Connexion Admin</h2>
  <input type="email" id="email" value="abdoul.aziz@adkoul.org">
  <input type="password" id="password" value="admin123">
  <button onclick="seConnecter()">Se connecter</button>
  <div id="message"></div>
</div>

<div class="box" id="dashboardTest">
  <h2>✅ Connexion Réussie !</h2>
  <p>Bienvenue <span id="nomUser"></span></p>
  <p>Rôle : <span id="roleUser"></span></p>
  <button onclick="location.reload()" style="background:#e74c3c;">Se déconnecter</button>
</div>

<script>
  const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

  async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function seConnecter() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');

    msg.textContent = "⏳ Vérification...";
    msg.style.color = "blue";

    try {
      const hash = await hashPassword(password);
      const response = await fetch(`${SUPABASE_URL}/rest/v1/admins?email=eq.${encodeURIComponent(email)}&password_hash=eq.${hash}&select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });

      const users = await response.json();
      
      if (users && users.length === 1) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboardTest').style.display = 'block';
        document.getElementById('nomUser').textContent = users[0].nom;
        document.getElementById('roleUser').textContent = users[0].role;
      } else {
        msg.textContent = "❌ Email ou mot de passe incorrect.";
        msg.style.color = "red";
      }
    } catch (err) {
      msg.textContent = "❌ Erreur : " + err.message;
      msg.style.color = "red";
    }
  }
</script>

</body>
</html>
