<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impression Ordre de Mission - ONG ADKOUL (diagnostic V2)</title>
<style>
@page{size:A4 portrait;margin:12mm 13mm}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#eef0f4;font:12px Arial,Helvetica,sans-serif;color:#111}
.document{width:184mm;margin:auto;background:white;padding:5mm 0;box-shadow:0 2px 12px #0002}
.om-page{width:100%;min-height:267mm;position:relative;background:#fff;padding:0 1mm}
.om-logo{display:block;width:32mm;height:32mm;object-fit:contain;margin:0 auto 1mm}
.om-brand{text-align:center;color:#fff;background:#87410c;font-size:23px;font-weight:700;line-height:1.15;padding:2mm 0}
.om-number{text-align:center;color:#fff;background:#203c70;font-size:14px;font-weight:700;padding:1.5mm;margin-top:5mm}
.om-office{background:#c7c7c7;font-weight:bold;font-size:13px;padding:1.5mm 0;margin-top:5mm}
.om-intro{font-weight:bold;margin-top:19mm;margin-bottom:8mm;font-size:13px}
.om-line{display:grid;grid-template-columns:49mm minmax(0,1fr);align-items:start;margin-bottom:5mm;line-height:1.4;break-inside:avoid;column-gap:1mm}
.om-label{font-weight:bold;min-width:0}
.om-value{min-width:0;overflow-wrap:break-word;white-space:pre-wrap}
.om-wide{display:grid;grid-template-columns:49mm minmax(0,1fr)}.om-wide .om-label{display:block;max-width:none;margin-bottom:0}
.om-wide .om-value{display:block;min-height:0}
.om-sign{text-align:center;margin-top:7mm;font-size:12px}
.om-sign p{margin:3mm 0}
.om-sign-title{text-decoration:underline;font-weight:normal}
.om-page-num{position:absolute;right:1mm;bottom:1mm;font-size:10px;border:1px solid #999;padding:2px 7px}
.om-visas{display:flex;flex-direction:column;gap:10mm;padding-top:0}
.om-visa{border:1px solid #222;height:47mm;display:grid;grid-template-columns:1fr 1fr;column-gap:5mm;padding:3mm 2mm;font-size:11px;break-inside:avoid}
.om-visa-col{min-width:0;display:flex;flex-direction:column;gap:6mm}
.om-visa-top{display:flex;justify-content:space-between;gap:2mm;white-space:nowrap;font-size:10px}
.om-visa-authority{line-height:1.9}
.om-visa-bottom{margin-left:13mm}
.btn-print{display:block;margin:20px auto;background:#20a55a;color:white;border:0;border-radius:6px;padding:14px 28px;font-weight:bold;cursor:pointer}
@media print{body{padding:0;background:#fff}.document{width:100%;padding:0;box-shadow:none}.om-page{min-height:267mm;break-after:page;page-break-after:always}.om-page:last-child{break-after:auto;page-break-after:auto}.btn-print{display:none!important}}
</style>
<script>
window.addEventListener('error', function(e) {
 const zone=document.getElementById('documentContent');
 if(zone) zone.textContent='Erreur JavaScript : '+(e.message || 'script bloqué')+' (ligne '+(e.lineno||'?')+').';
});
window.addEventListener('DOMContentLoaded',function(){
 setTimeout(function(){
  const zone=document.getElementById('documentContent');
  if(zone && zone.textContent.includes('Vérification de l’ordre')) {
   zone.textContent='Le chargement a dépassé 15 secondes. Vérifiez la connexion Supabase ou ouvrez la console F12 pour relever l’erreur.';
  }
 },15000);
});
</script>
</head>
<body>

<div class="document" id="documentContent">
  <p style="text-align: center; color: #666; padding: 50px; font-family: sans-serif;">⏳ Vérification de l’ordre de mission n° 31…</p>
</div>

<button class="btn-print" id="btnPrint" style="display: none;" onclick="window.print()">🖨️ Imprimer le document</button>


<script>
  const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

  // Lecture de la session existante sans dépendance CDN ni verrou supabase-js.
  const contenu=document.getElementById("documentContent");
  const escapeHtml=value=>String(value??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function refuser(texte){contenu.textContent=texte;document.getElementById("btnPrint").style.display="none";}
  const urlParams = new URLSearchParams(window.location.search);
  const ordreId = urlParams.get('id');

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleDateString('fr-FR');
  }

  async function consulter(){
    if(!ordreId){refuser("Aucun identifiant fourni.");return;}

    const limite = (promesse, duree = 10000) => Promise.race([
      promesse, new Promise((_, rejeter) => setTimeout(() => rejeter(new Error("Délai dépassé")), duree))
    ]);
    let session;
    try {
      const cle = "sb-mvmzhdvkeromtljnvrow-auth-token";
      let sauvegarde = null;
      try { sauvegarde = JSON.parse(localStorage.getItem(cle) || "null"); } catch (_) {}
      session = sauvegarde?.currentSession || sauvegarde;
      if (!session?.access_token) {
        refuser("Connexion Supabase Auth requise. Connectez-vous à admin.html puis réessayez.");
        return;
      }
      const identite = await limite(fetch(SUPABASE_URL + '/auth/v1/user', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token },
        cache: 'no-store'
      }));
      if (!identite.ok) { refuser("Session expirée : reconnectez-vous à admin.html."); return; }
      const user = await identite.json();
      if (!user?.email) { refuser("Compte Supabase Auth non reconnu."); return; }
      const profilResponse = await limite(fetch(SUPABASE_URL + '/rest/v1/admins?select=role&auth_id=eq.' + encodeURIComponent(user.id), {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token },
        cache: 'no-store'
      }));
      if (!profilResponse.ok) { refuser("Impossible de vérifier les droits de ce compte."); return; }
      const profils = await profilResponse.json();
      if (!Array.isArray(profils) || profils.length !== 1 ||
          !["rh","directeur_logistique","logistique"].includes(String(profils[0].role || "").toLowerCase())) {
        refuser("Accès refusé : profil RH ou Logistique autorisé requis."); return;
      }
    } catch (err) {
      refuser("Chargement interrompu : " + (err?.message || "Erreur réseau") + ". Réessayez après reconnexion.");
      return;
    }
    limite(fetch(SUPABASE_URL + '/rest/v1/missions_2?id=eq.' + encodeURIComponent(ordreId) + '&select=' + encodeURIComponent('id,nom,poste,accompagnateurs,destination,objectif,moyen_deplacement,chauffeur_assigne,vehicule_assigne,date_depart,date_retour,imputation_budgetaire,bureau,statut,message_admin'), {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token },
      cache: "no-store"
    }), 12000)
    .then(res => {if(!res.ok)throw Error("Accès à la demande refusé.");return res.json();})
    .then(data => {
      if (data && data.length > 0) {
        const d = data[0];
        const transportCollectif = ['bus', 'avion'].includes(String(d.moyen_deplacement || '').trim().toLowerCase());
        const chauffeurAffiche = transportCollectif ? 'Sans objet' : (d.chauffeur_assigne || '—');
        const vehiculeAffiche = transportCollectif ? (d.moyen_deplacement || '—') : (d.vehicule_assigne || '—');

        if (String(d.statut || '').toLowerCase() !== 'validee') {
          refuser("Ordre non validé par les RH : impression officielle indisponible.");
          return;
        }
        const numero = String(d.message_admin || '').trim();
        if (!/^[0-9]+[ ]*\/ADKOUL\/[0-9]{4}$/i.test(numero)) {
          refuser("Numéro officiel absent : demandez la finalisation de la numérotation avant impression.");
          return;
        }
        const annee = (numero.match(/[0-9]{4}$/) || [new Date().getFullYear().toString()])[0];
        const bureau = d.bureau || 'Tahoua';
        const visa = Array.from({length:4}, () => `
          <div class="om-visa">
            <div class="om-visa-col">
              <div class="om-visa-top"><span>Lieu :</span><span>Date de départ : ....../....../${annee}</span></div>
              <div class="om-visa-authority">.................... &nbsp; Autorité : ..............................<div>................................................</div></div>
              <div class="om-visa-bottom">Visa : ................................</div>
            </div>
            <div class="om-visa-col">
              <div class="om-visa-top"><span>Lieu :</span><span>Date d’arrivée : ....../....../${annee}</span></div>
              <div class="om-visa-authority">.................... &nbsp; Autorité : ..............................<div>................................................</div></div>
              <div class="om-visa-bottom">Visa : ................................</div>
            </div>
          </div>`).join('');
        document.getElementById('documentContent').innerHTML = `
          <section class="om-page">
            <img class="om-logo" src="logo.webp" alt="Logo ONG ADKOUL">
            <div class="om-brand">ONG ADKOUL</div>
            <div class="om-number">ORDRE DE MISSION N° ${escapeHtml(numero)}</div>
            <div class="om-office">Bureau : ${escapeHtml(bureau)}</div>
            <div class="om-intro">LE SECRETAIRE EXECUTIF DE L’ONG ADKOUL AUTORISE :</div>
            <div class="om-line"><span class="om-label">CHEF DE MISSION :</span><span class="om-value">${escapeHtml(d.nom)}</span></div>
            <div class="om-line"><span class="om-label">EMPLOI OCCUPE :</span><span class="om-value">${escapeHtml(d.poste)}</span></div>
            <div class="om-line"><span class="om-label">ACCOMPAGNATEURS :</span><span class="om-value">${escapeHtml(d.accompagnateurs || '')}</span></div>
            <div class="om-line om-wide"><span class="om-label">DE SE RENDRE EN MISSION A :</span><span class="om-value">${escapeHtml(d.destination)}</span></div>
            <div class="om-line om-wide"><span class="om-label">OBJECTIF DE LA MISSION :</span><span class="om-value">${escapeHtml(d.objectif)}</span></div>
            <div class="om-line"><span class="om-label">MOYEN DE DEPLACEMENT :</span><span class="om-value">${escapeHtml(d.moyen_deplacement)}</span></div>
            <div class="om-line"><span class="om-label">CHAUFFEUR :</span><span class="om-value">${escapeHtml(chauffeurAffiche)}</span></div>
            <div class="om-line"><span class="om-label">DATE DE DEPART :</span><span class="om-value">${formatDate(d.date_depart)}</span></div>
            <div class="om-line"><span class="om-label">DATE DE RETOUR PREVUE :</span><span class="om-value">${formatDate(d.date_retour)}</span></div>
            <div class="om-line"><span class="om-label">IMPUTATION BUDGETAIRE :</span><span class="om-value">${escapeHtml(d.imputation_budgetaire)}</span></div>
            <div class="om-sign"><p class="om-sign-title">DATE ET SIGNATURE :</p><p>Fait à ${escapeHtml(bureau)}, le ${formatDate(d.date_depart)}</p><p><b>SECRETAIRE EXECUTIF</b></p></div>
            <div class="om-page-num">1</div>
          </section>
          <section class="om-page om-visas">${visa}<div class="om-page-num">2</div></section>
        `;
        document.getElementById('btnPrint').style.display = 'block';
      } else {
        document.getElementById('documentContent').innerHTML = `<p style="text-align: center; color: red;">Erreur : Ordre de mission introuvable.</p>`;
      }
    })
    .catch(err => {
      document.getElementById('documentContent').innerHTML = `<p style="text-align: center; color: red;">Erreur : ${err.message}</p>`;
    });
  }
  consulter().catch(err=>{console.error("Consultation refusée :",err);refuser("Consultation impossible : "+(err?.message||"vérifiez votre session et vos droits."));});
</script>

</body>
</html>
