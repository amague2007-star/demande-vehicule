<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Connexion - ONG ADKOUL</title>
<style>
  body { font-family: Arial, sans-serif; background: #1e3c72; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  h2 { color: #1e3c72; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
  button { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #229954; }
  #message { margin-top: 15px; font-weight: bold; font-size: 14px; }
</style>
</head>
<body>

<div class="box">
  <h2>Connexion Admin</h2>
  <input type="email" id="email" placeholder="Email" value="abdoul.aziz@adkoul.org">
  <input type="password" id="password" placeholder="Mot de passe" value="admin123">
  <button onclick="seConnecter()">Se connecter</button>
  <div id="message"></div>
</div>

<script>
  const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

  async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function seConnecter() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');

    msg.textContent = "⏳ Vérification...";
    msg.style.color = "blue";

    try {
      const hash = await hashPassword(password);
      const response = await fetch(`${SUPABASE_URL}/rest/v1/admins?email=eq.${encodeURIComponent(email)}&password_hash=eq.${hash}&select=*`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });

      const users = await response.json();
      
      if (users && users.length === 1) {
        msg.textContent = "✅ Connexion réussie ! Bienvenue " + users[0].nom;
        msg.style.color = "green";
        // Ici, on sauvegarde la session pour la suite
        sessionStorage.setItem('admin_logged', 'true');
        sessionStorage.setItem('admin_name', users[0].nom);
        sessionStorage.setItem('admin_role', users[0].role);
        // Redirection vers le tableau de bord (si vous le souhaitez)
        // window.location.href = "dashboard.html"; 
      } else {
        msg.textContent = "❌ Email ou mot de passe incorrect.";
        msg.style.color = "red";
      }
    } catch (err) {
      msg.textContent = "❌ Erreur : " + err.message;
      msg.style.color = "red";
    }
  }
</script>

</body>
</html>
