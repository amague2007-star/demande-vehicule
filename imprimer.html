<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impression Ordre de Mission - ONG ADKOUL</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
  .document { background: #fff; max-width: 800px; margin: 0 auto; padding: 40px 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #000; }
  
  /* NOUVEAU : Style pour l'en-tête image */
  .entete-document {
    width: 100%;
    margin-bottom: 30px;
    display: block;
  }

  .header h1 { font-size: 24px; font-weight: bold; margin: 0 0 5px 0; }
  .header h2 { font-size: 14px; font-weight: normal; font-style: italic; margin: 0 0 20px 0; color: #333; }
  .titre-om { text-align: center; font-size: 20px; font-weight: bold; margin: 20px 0 30px 0; }
  .bureau { font-weight: bold; margin-bottom: 20px; font-size: 15px; }
  .contenu { font-size: 15px; line-height: 1.4; }
  .contenu p { margin-bottom: 20px; font-weight: bold; }
  .ligne { margin-bottom: 10px; display: flex; }
  .label { font-weight: bold; width: 220px; flex-shrink: 0; text-transform: uppercase; }
  .valeur { flex-grow: 1; }
  .footer-page1 { margin-top: 40px; }
  .footer-page1 p { margin-bottom: 5px; }
  .signature-bas { margin-top: 30px; text-align: right; }

  @media print {
    body { background: #fff; padding: 0; margin: 0; }
    .document { box-shadow: none; padding: 0; max-width: 100%; }
    .btn-print { display: none; }
    @page { size: A4 portrait; margin: 20mm; }
    .page-2 { page-break-before: always; border-top: none !important; margin-top: 0 !important; padding-top: 0 !important; }
  }

  .page-2 { margin-top: 40px; border-top: 2px dashed #ccc; padding-top: 40px; }
  .cadre-signature { border: 1px solid #000; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 13px; page-break-inside: avoid; height: 150px; box-sizing: border-box; }
  .colonne-signature { width: 48%; display: flex; flex-direction: column; justify-content: space-between; }
  .ligne-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .ligne-milieu { display: flex; gap: 5px; margin-bottom: 10px; }
  .ligne-bas { display: flex; gap: 5px; }
  .btn-print { display: block; width: 250px; margin: 30px auto 0; padding: 15px; background: #27ae60; color: #fff; text-align: center; text-decoration: none; font-family: sans-serif; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; }
  .btn-print:hover { background: #229954; }
</style>
</head>
<body>

<div class="document" id="documentContent">
  <p style="text-align: center; color: #666; padding: 50px; font-family: sans-serif;">⏳ Chargement des données...</p>
</div>

<button class="btn-print" id="btnPrint" style="display: none;" onclick="window.print()">🖨️ Imprimer le document</button>

<script>
  const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

  const contenu = document.getElementById("documentContent");
  const escapeHtml = value => String(value ?? "—").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  
  function refuser(texte) {
    contenu.innerHTML = `<p style="text-align: center; color: red;">${texte}</p>`;
    document.getElementById("btnPrint").style.display = "none";
  }

  const urlParams = new URLSearchParams(window.location.search);
  const ordreId = urlParams.get('id');

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleDateString('fr-FR');
  }

  async function consulter() {
    if (!ordreId) { refuser("Aucun identifiant fourni dans le lien."); return; }

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/missions_2?id=eq.${encodeURIComponent(ordreId)}&select=*`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        },
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Erreur de connexion à la base de données.");
      }

      const data = await response.json();

      if (data && data.length > 0) {
        const d = data[0];
        
        // ⚠️ REMPLACEZ LE LIEN CI-DESSOUS PAR LE LIEN DE VOTRE IMAGE ⚠️
        const lienEntete = "https://github.com/amague2007-star/demande-vehicule/assets/VOTRE_ID_IMAGE"; 

        document.getElementById('documentContent').innerHTML = `
          <!-- EN-TÊTE AVEC IMAGE -->
          <img src="${lienEntete}" alt="En-tête ONG ADKOUL" class="entete-document">

          <!-- PAGE 1 -->
          <div class="header">
            <h1>ONG ADKOUL</h1>
            <h2>Solidarité • Éducation • Développement</h2>
          </div>
          
          <div class="titre-om">DEMANDE D'ORDRE DE MISSION — Référence ${escapeHtml(d.id)}</div>
          
          <div class="bureau">Bureau : ${escapeHtml(d.bureau)}</div>
          
          <div class="contenu">
            <p>LE SECRETAIRE EXECUTIF DE L'ONG ADKOUL AUTORISE :</p>
            
            <div class="ligne"><span class="label">CHEF DE MISSION :</span> <span class="valeur">${escapeHtml(d.nom)}</span></div>
            <div class="ligne"><span class="label">EMPLOI OCCUPE :</span> <span class="valeur">${escapeHtml(d.poste)}</span></div>
            <div class="ligne"><span class="label">ACCOMPAGNATEURS :</span> <span class="valeur">${escapeHtml(d.accompagnateurs || '—')}</span></div>
            <div class="ligne"><span class="label">DE SE RENDRE EN MISSION A :</span> <span class="valeur">${escapeHtml(d.destination)}</span></div>
            <div class="ligne"><span class="label">OBJECTIF DE LA MISSION :</span> <span class="valeur">${escapeHtml(d.objectif)}</span></div>
            <div class="ligne"><span class="label">MOYEN DE DEPLACEMENT :</span> <span class="valeur">${escapeHtml(d.moyen_deplacement)}</span></div>
            <div class="ligne"><span class="label">CHAUFFEUR :</span> <span class="valeur">${escapeHtml(d.chauffeur_assigne || '—')}</span></div>
            <div class="ligne"><span class="label">VÉHICULE :</span> <span class="valeur">${escapeHtml(d.vehicule_assigne || '—')}</span></div>
            <div class="ligne"><span class="label">DATE DE DEPART :</span> <span class="valeur">${formatDate(d.date_depart)}</span></div>
            <div class="ligne"><span class="label">DATE DE RETOUR PREVUE :</span> <span class="valeur">${formatDate(d.date_retour)}</span></div>
            <div class="ligne"><span class="label">IMPUTATION BUDGETAIRE :</span> <span class="valeur">${escapeHtml(d.imputation_budgetaire)}</span></div>
          </div>

          <div class="footer-page1">
            <p>DATE ET SIGNATURE :</p>
            <p>Fait à ${escapeHtml(d.bureau)}, le ${formatDate(d.date_depart)}</p>
            
            <div class="signature-bas">
              <p style="font-weight: bold;">SECRETAIRE EXECUTIF</p>
            </div>
          </div>

          <!-- PAGE 2 : CADRES DE VISAS -->
          <div class="page-2">
            ${Array(4).fill(`
            <div class="cadre-signature">
              <div class="colonne-signature">
                <div>
                  <div class="ligne-top"><span>Lieu : ..................................</span><span>Date de départ : ....../....../2026</span></div>
                  <div class="ligne-milieu"><span>Autorité : ..................................</span></div>
                </div>
                <div class="ligne-bas"><span>Visa : ..................................</span></div>
              </div>
              <div class="colonne-signature">
                <div>
                  <div class="ligne-top"><span>Lieu : ..................................</span><span>Date d'arrivée : ....../....../2026</span></div>
                  <div class="ligne-milieu"><span>Autorité : ..................................</span></div>
                </div>
                <div class="ligne-bas"><span>Visa : ..................................</span></div>
              </div>
            </div>
            `).join('')}
          </div>
        `;
        document.getElementById('btnPrint').style.display = 'block';
      } else {
        refuser("Erreur : Ordre de mission introuvable dans la base de données.");
      }
    } catch (err) {
      refuser("Erreur : " + err.message);
    }
  }

  consulter();
</script>

</body>
</html>
