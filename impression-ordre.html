<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impression Ordre de Mission - ONG ADKOUL</title>
<style>
  /* Styles globaux pour l'écran */
  body { 
    font-family: Arial, Helvetica, sans-serif; 
    background: #f0f2f5; 
    margin: 0; 
    padding: 20px; 
  }
  
  .document { 
    background: #fff; 
    max-width: 800px; 
    margin: 0 auto; 
    padding: 40px 50px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    color: #000;
  }

  /* Styles de la PAGE 1 */
  .header h1 { 
    font-size: 24px; 
    font-weight: bold; 
    margin: 0 0 5px 0; 
  }
  .header h2 { 
    font-size: 14px; 
    font-weight: normal; 
    font-style: italic; 
    margin: 0 0 20px 0; 
    color: #333;
  }
  
  .titre-om { 
    text-align: center; 
    font-size: 20px; 
    font-weight: bold; 
    margin: 20px 0 30px 0; 
  }
  
  .bureau { 
    font-weight: bold; 
    margin-bottom: 20px; 
    font-size: 15px; 
  }
  
  .contenu { 
    font-size: 15px; 
    line-height: 1.4; 
  }
  
  .contenu p { 
    margin-bottom: 20px; 
    font-weight: bold; 
  }
  
  .ligne { 
    margin-bottom: 10px; 
    display: flex; 
  }
  
  .label { 
    font-weight: bold; 
    width: 220px; 
    flex-shrink: 0; 
    text-transform: uppercase; 
  }
  
  .valeur { 
    flex-grow: 1; 
  }
  
  .footer-page1 { 
    margin-top: 40px; 
  }
  
  .footer-page1 p { 
    margin-bottom: 5px; 
  }
  
  .signature-bas { 
    margin-top: 30px; 
    text-align: right; 
  }

  /* --- CONFIGURATION SPÉCIFIQUE POUR L'IMPRESSION --- */
  @media print {
    body { 
      background: #fff; 
      padding: 0; 
      margin: 0; 
    }
    .document { 
      box-shadow: none; 
      padding: 0; 
      max-width: 100%; 
    }
    .btn-print { 
      display: none; 
    }
    
    /* Format A4 strict, marges réalistes */
    @page { 
      size: A4 portrait; 
      margin: 20mm; 
    }
    
    /* C'est cette règle qui force la page 2 */
    .page-2 { 
      page-break-before: always; 
      border-top: none !important; 
      margin-top: 0 !important; 
      padding-top: 0 !important; 
    }
  }

  /* --- STYLES DE LA PAGE 2 (CADRES) --- */
  .page-2 { 
    margin-top: 40px; 
    border-top: 2px dashed #ccc; 
    padding-top: 40px; 
  }
  
  .cadre-signature {
    border: 1px solid #000;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    page-break-inside: avoid; /* Evite qu'un cadre soit coupé en deux */
    height: 150px; /* Hauteur fixe pour ressembler au Word */
    box-sizing: border-box;
  }
  
  .colonne-signature { 
    width: 48%; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  
  .ligne-top { 
    display: flex; 
    justify-content: space-between; 
    margin-bottom: 10px;
  }
  
  .ligne-milieu { 
    display: flex; 
    gap: 5px;
    margin-bottom: 10px;
  }
  
  .ligne-bas { 
    display: flex; 
    gap: 5px;
  }

  /* Bouton d'impression */
  .btn-print { 
    display: block; 
    width: 250px; 
    margin: 30px auto 0; 
    padding: 15px; 
    background: #27ae60; 
    color: #fff; 
    text-align: center; 
    text-decoration: none; 
    font-family: sans-serif; 
    font-weight: bold; 
    border-radius: 8px; 
    border: none; 
    cursor: pointer; 
    font-size: 16px; 
  }
  .btn-print:hover { background: #229954; }

</style>
</head>
