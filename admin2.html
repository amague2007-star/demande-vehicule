<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - ONG ADKOUL</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* CSS MINIMAL POUR LE TEST */
  body { font-family: Arial; background: #f0f2f5; margin: 0; }
  #loginScreen { display: flex; align-items: center; justify-content: center; height: 100vh; background: #1e3c72; }
  .login-box { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; }
  .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  .login-box button { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  #dashboard { display: none; padding: 30px; }
  header { background: #1e3c72; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
  .nav-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-left: 10px; }
  .nav-btn.active { background: white; color: #1e3c72; }
  .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-left: 10px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
  .stat-card { background: white; padding: 20px; border-radius: 10px; }
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .chart-box { background: white; padding: 20px; border-radius: 10px; height: 300px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>ONG ADKOUL</h1>
    <p>Espace de Gestion</p>
    <input type="email" id="adminEmail" value="abdoul.aziz@adkoul.org">
    <input type="password" id="adminPassword" value="admin123">
    <button onclick="login()">Se connecter</button>
    <div id="loginError" style="color: red; margin-top: 10px;"></div>
  </div>
</div>

<div id="dashboard">
  <header>
    <div>
      <h2>ONG ADKOUL — Tableau de bord</h2>
      <span id="userName">Admin</span>
    </div>
    <div>
      <button class="nav-btn active" onclick="afficherSection('accueil')">📊 Accueil</button>
      <button class="nav-btn" onclick="afficherSection('demandes')">📋 Demandes</button>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div id="accueilSection" style="display: block;">
    <div class="stats">
      <div class="stat-card"><h3>Total Demandes</h3><div id="dashTotal">0</div></div>
      <div class="stat-card"><h3>Missions</h3><div id="dashMissions">0</div></div>
      <div class="stat-card"><h3>Validées</h3><div id="dashValidees">0</div></div>
      <div class="stat-card"><h3>En Attente</h3><div id="dashAttente">0</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-box"><canvas id="chartMoyens"></canvas></div>
      <div class="chart-box"><canvas id="chartStatuts"></canvas></div>
    </div>
  </div>

  <div id="demandesSection" style="display: none;">
    <h2>Liste des demandes (simulée)</h2>
  </div>
</div>

<script>
  // LES CONSTANTES
  const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

  let toutesLesDemandes = [];
  let tousLesOrdres = [];
  let chartMoyensInstance = null;
  let chartStatutsInstance = null;

  // LA FONCTION LOGIN QUI MARCHE (COPIÉE DU TEST)
  async function login() {
    const email = document.getElementById('adminEmail').value.trim().toLowerCase();
    const password = document.getElementById('adminPassword').value;
    const errorEl = document.getElementById('loginError');

    errorEl.textContent = "⏳ Vérification...";
    errorEl.style.color = "blue";

    try {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

      const response = await fetch(`${SUPABASE_URL}/rest/v1/admins?email=eq.${encodeURIComponent(email)}&password_hash=eq.${hash}&select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });

      const users = await response.json();

      if (users && users.length === 1) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('userName').textContent = users[0].nom;
        
        // Charger les données pour les graphiques
        chargerDonnees();
        
      } else {
        errorEl.textContent = "❌ Email ou mot de passe incorrect.";
        errorEl.style.color = "red";
      }
    } catch (err) {
      errorEl.textContent = "❌ Erreur réseau : " + err.message;
      errorEl.style.color = "red";
    }
  }

  function logout() {
    location.reload();
  }

  function afficherSection(section) {
    document.getElementById('accueilSection').style.display = section === 'accueil' ? 'block' : 'none';
    document.getElementById('demandesSection').style.display = section === 'demandes' ? 'block' : 'none';
  }

  // CHARGER LES DONNÉES POUR LES GRAPHIQUES
  async function chargerDonnees() {
    try {
      // 1. Charger les demandes
      const resDemandes = await fetch(`${SUPABASE_URL}/rest/v1/demandes?select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      toutesLesDemandes = await resDemandes.json();

      // 2. Charger les missions
      const resMissions = await fetch(`${SUPABASE_URL}/rest/v1/missions_2?select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      tousLesOrdres = await resMissions.json();

      // Mettre à jour les compteurs
      document.getElementById('dashTotal').textContent = toutesLesDemandes.length;
      document.getElementById('dashMissions').textContent = tousLesOrdres.length;
      document.getElementById('dashValidees').textContent = tousLesOrdres.filter(o => o.statut === 'validee').length;
      document.getElementById('dashAttente').textContent = tousLesOrdres.filter(o => o.statut === 'en_attente').length;

      // Créer les graphiques
      if (chartMoyensInstance) chartMoyensInstance.destroy();
      chartMoyensInstance = new Chart(document.getElementById('chartMoyens'), {
        type: 'doughnut',
        data: {
          labels: ['UNHCR', 'Partenaire', 'Location', 'Bus', 'Vol'],
          datasets: [{
            data: [
              tousLesOrdres.filter(o => o.moyen_deplacement === 'Véhicule UNHCR').length,
              tousLesOrdres.filter(o => o.moyen_deplacement === 'Véhicule Partenaire').length,
              tousLesOrdres.filter(o => o.moyen_deplacement === 'Véhicule Location').length,
              tousLesOrdres.filter(o => o.moyen_deplacement === 'Bus').length,
              tousLesOrdres.filter(o => o.moyen_deplacement === 'Avion').length
            ],
            backgroundColor: ['#2980b9', '#f39c12', '#27ae60', '#8e44ad', '#e74c3c']
          }]
        }
      });

      if (chartStatutsInstance) chartStatutsInstance.destroy();
      chartStatutsInstance = new Chart(document.getElementById('chartStatuts'), {
        type: 'bar',
        data: {
          labels: ['Attente', 'Attente RH', 'Validés'],
          datasets: [{
            data: [
              tousLesOrdres.filter(o => o.statut === 'en_attente').length,
              tousLesOrdres.filter(o => o.statut === 'affecte_logistique').length,
              tousLesOrdres.filter(o => o.statut === 'validee').length
            ],
            backgroundColor: ['#f39c12', '#f1c40f', '#27ae60']
          }]
        }
      });

    } catch (err) {
      console.error("Erreur chargement données:", err);
      alert("Connexion réussie, mais erreur de chargement des données : " + err.message);
    }
  }
</script>
</body>
</html>
