<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande de Sortie Véhicule</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:linear-gradient(135deg,#1e3c72,#2a5298); min-height:100vh; padding:20px; }
  .container { max-width:900px; margin:0 auto; background:#fff; border-radius:15px;
               box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden; }
  header { background:#1e3c72; color:#fff; padding:25px; text-align:center; }
  header h1 { font-size:24px; }
  header p { font-size:14px; opacity:0.85; margin-top:5px; }
  .content { padding:30px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .form-group { display:flex; flex-direction:column; }
  .form-group.full { grid-column:1 / -1; }
  label { font-weight:600; margin-bottom:6px; color:#333; font-size:14px; }
  label .required { color:#e74c3c; }
  input,select,textarea { padding:11px 14px; border:2px solid #e0e0e0; border-radius:8px;
    font-size:14px; transition:0.2s; outline:none; }
  input:focus,select:focus,textarea:focus { border-color:#2a5298;
    box-shadow:0 0 0 3px rgba(42,82,152,0.15); }
  textarea { resize:vertical; min-height:80px; }
  .btn-primary { background:#1e3c72; color:#fff; width:100%; margin-top:20px;
    padding:14px; border:none; border-radius:8px; font-size:16px;
    font-weight:600; cursor:pointer; transition:0.2s; }
  .btn-primary:hover { background:#2a5298; transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(30,60,114,0.3); }
  .btn-primary:disabled { background:#95a5a6; cursor:not-allowed; transform:none; }
  .message { padding:15px; border-radius:8px; margin-bottom:20px;
    display:none; font-weight:600; }
  .message.success { background:#d4edda; color:#155724;
    border:2px solid #c3e6cb; display:block; }
  .message.error { background:#f8d7da; color:#721c24;
    border:2px solid #f5c6cb; display:block; }
  .message.warning { background:#fff3cd; color:#856404;
    border:2px solid #ffeeba; display:block; }
  .loader { display:none; text-align:center; padding:15px;
    color:#1e3c72; font-weight:600; }
  .loader.active { display:block; }
  @media (max-width:600px) { .form-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚗 Gestion des Sorties de Véhicules</h1>
    <p>Système de demande et suivi logistique</p>
  </header>

  <div class="content">
    <div id="messageBox" class="message"></div>

    <form id="formDemande" onsubmit="soumettre(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>Nom <span class="required">*</span></label>
          <input type="text" id="nom" required placeholder="Ex: DUPONT">
        </div>
        <div class="form-group">
          <label>Prénom <span class="required">*</span></label>
          <input type="text" id="prenom" required placeholder="Ex: Jean">
        </div>

        <div class="form-group">
          <label>Poste occupé <span class="required">*</span></label>
          <input type="text" id="poste" required placeholder="Ex: Chauffeur, Technicien...">
        </div>
        <div class="form-group">
          <label>Service / Département</label>
          <input type="text" id="service" placeholder="Ex: Logistique">
        </div>

        <div class="form-group">
          <label>Email de l'agent <span class="required">*</span></label>
          <input type="email" id="email" required placeholder="Ex: agent@exemple.com">
        </div>
        <div class="form-group">
          <label>Contact (téléphone)</label>
          <input type="tel" id="contact" placeholder="Ex: +227 90 00 00 00">
        </div>

        <div class="form-group">
          <label>Date de sortie <span class="required">*</span></label>
          <input type="date" id="dateSortie" required>
        </div>
        <div class="form-group">
          <label>Heure de départ <span class="required">*</span></label>
          <input type="time" id="heureDepart" required>
        </div>

        <div class="form-group">
          <label>Destination <span class="required">*</span></label>
          <input type="text" id="destination" required placeholder="Ex: Marché central">
        </div>
        <div class="form-group">
          <label>Durée estimée (minutes) <span class="required">*</span></label>
          <input type="number" id="duree" required min="1" placeholder="Ex: 120">
        </div>

        <div class="form-group">
          <label>Véhicule souhaité / Type</label>
          <input type="text" id="vehicule" placeholder="Ex: Camionnette, 4x4...">
        </div>
        <div class="form-group">
          <label>Nombre de passagers</label>
          <input type="number" id="passagers" min="1" placeholder="Ex: 3">
        </div>

        <div class="form-group full">
          <label>Motif / Objet de la sortie <span class="required">*</span></label>
          <textarea id="motif" required placeholder="Précisez la raison de la sortie..."></textarea>
        </div>

        <div class="form-group full">
          <label>Nom du responsable à valider</label>
          <input type="text" id="responsable" placeholder="Ex: M. le Directeur Logistique">
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn-primary">✅ Envoyer la demande</button>
      <div id="loader" class="loader">⏳ Envoi de la demande en cours...</div>
    </form>
  </div>
</div>

<script>
  // ============================================================
  // ⚠️⚠️⚠️ CONFIGURATION - REMPLACEZ LES 3 VALEURS CI-DESSOUS ⚠️⚠️⚠️
  // ============================================================

  // 1) URL de votre projet Supabase
  //    Où la trouver : supabase.com → votre projet → Settings → API → "Project URL"
  //    Exemple : "https://abcdefgh.supabase.co"
  const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co/rest/v1/";

  // 2) Clé publique "anon" de Supabase
  //    Où la trouver : supabase.com → votre projet → Settings → API → "anon public"
  //    (commence par eyJ... et est très longue)
  const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

  // 3) URL de votre formulaire Formspree
  //    Où la trouver : formspree.io → votre formulaire → copier l'URL
  //    Exemple : "https://formspree.io/f/xyzabcde"
  const FORMSPREE_URL = "https://formspree.io/f/xvkgqgvb";

  // ============================================================
  // NE MODIFIEZ RIEN EN DESSOUS DE CETTE LIGNE
  // ============================================================

  // Mettre la date d'aujourd'hui par défaut
  document.getElementById('dateSortie').valueAsDate = new Date();

  function val(id) { return document.getElementById(id).value.trim(); }

  function afficherMessage(texte, type) {
    const box = document.getElementById('messageBox');
    box.className = 'message ' + type;
    box.textContent = texte;
    box.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  async function soumettre(e) {
    e.preventDefault();

    // Vérifier que la configuration a été faite
    if (SUPABASE_URL.includes('VOTRE_URL') || FORMSPREE_URL.includes('VOTRE_CODE')) {
      afficherMessage("⚠️ Configuration incomplète. L'administrateur doit renseigner les clés dans le fichier. Contactez le service logistique.", 'error');
      return;
    }

    const btn = document.getElementById('btnSubmit');
    const loader = document.getElementById('loader');

    // Récupérer les données du formulaire
    const demande = {
      nom: val('nom'),
      prenom: val('prenom'),
      poste: val('poste'),
      service: val('service'),
      email: val('email'),
      contact: val('contact'),
      date_sortie: val('dateSortie'),
      heure_depart: val('heureDepart'),
      destination: val('destination'),
      duree: parseInt(val('duree')),
      vehicule_souhaite: val('vehicule'),
      passagers: val('passagers') ? parseInt(val('passagers')) : null,
      motif: val('motif'),
      responsable: val('responsable')
    };

    // Désactiver le bouton et afficher le loader
    btn.disabled = true;
    btn.textContent = '⏳ Envoi en cours...';
    loader.classList.add('active');

    let supabaseOK = false;
    let formspreeOK = false;
    let erreurs = [];

    // ---------- 1) ENREGISTREMENT DANS SUPABASE ----------
    try {
      const response = await fetch(SUPABASE_URL + '/rest/v1/demandes', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(demande)
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error('Supabase ' + response.status + ' : ' + errText);
      }
      supabaseOK = true;
      console.log('✅ Enregistré dans Supabase');
    } catch (err) {
      console.error('❌ Erreur Supabase :', err);
      erreurs.push('Base de données : ' + err.message);
    }

    // ---------- 2) ENVOI EMAIL VIA FORMSPREE ----------
    try {
      const response = await fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          _subject: `🚗 Nouvelle demande - ${demande.prenom} ${demande.nom} - ${demande.destination}`,
          _replyto: demande.email,
          "Nom": demande.nom,
          "Prénom": demande.prenom,
          "Poste occupé": demande.poste,
          "Service": demande.service || '-',
          "Email agent": demande.email,
          "Contact": demande.contact || '-',
          "Date de sortie": demande.date_sortie,
          "Heure de départ": demande.heure_depart,
          "Destination": demande.destination,
          "Durée (min)": demande.duree,
          "Véhicule souhaité": demande.vehicule_souhaite || '-',
          "Passagers": demande.passagers || '-',
          "Motif": demande.motif,
          "Responsable": demande.responsable || '-'
        })
      });

      if (!response.ok) {
        throw new Error('Formspree ' + response.status);
      }
      formspreeOK = true;
      console.log('✅ Email envoyé via Formspree');
    } catch (err) {
      console.error('❌ Erreur Formspree :', err);
      erreurs.push('Notification email : ' + err.message);
    }

    // ---------- 3) AFFICHAGE DU RÉSULTAT ----------
    if (supabaseOK && formspreeOK) {
      afficherMessage('✅ Votre demande a bien été enregistrée et envoyée au service Logistique. Vous recevrez un email après validation.', 'success');
      e.target.reset();
      document.getElementById('dateSortie').valueAsDate = new Date();
    } else if (supabaseOK && !formspreeOK) {
      afficherMessage("⚠️ Votre demande a été enregistrée dans la base de données, mais la notification email n'a pas pu être envoyée. Le service logistique verra quand même votre demande dans son tableau de bord.", 'warning');
      e.target.reset();
      document.getElementById('dateSortie').valueAsDate = new Date();
    } else {
      afficherMessage("❌ Erreur d'envoi : " + erreurs.join(' | ') + ". Vérifiez votre connexion internet et réessayez.", 'error');
    }

    // Réactiver le bouton
    btn.disabled = false;
    btn.textContent = '✅ Envoyer la demande';
    loader.classList.remove('active');
  }
</script>
</body>
</html>
