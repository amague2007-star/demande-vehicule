<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Test</title></head>
<body style="font-family:Arial; padding:50px; background:#f0f2f5;">
  <div style="background:white; padding:30px; border-radius:10px; max-width:600px; margin:0 auto;">
    <h2 style="color:#1e3c72;">Test de connexion Supabase (sur GitHub)</h2>
    <button onclick="tester()" style="padding:15px 30px; font-size:16px; cursor:pointer; background:#27ae60; color:white; border:none; border-radius:8px;">Tester la connexion</button>
    <div id="resultat" style="margin-top:20px; font-size:18px; font-weight:bold;"></div>
  </div>

  <script>
    async function tester() {
      const resultat = document.getElementById('resultat');
      resultat.textContent = "⏳ Connexion en cours...";
      resultat.style.color = "blue";

      const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co";
      const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";
      const email = "abdoul.aziz@adkoul.org";
      const password = "admin123";

      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

        const response = await fetch(`${SUPABASE_URL}/rest/v1/admins?email=eq.${encodeURIComponent(email)}&password_hash=eq.${hash}&select=*`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });

        const users = await response.json();

        if (users && users.length === 1) {
          resultat.textContent = "✅ SUCCÈS ! Compte trouvé : " + users[0].nom;
          resultat.style.color = "green";
        } else {
          resultat.textContent = "❌ ÉCHEC : " + JSON.stringify(users);
          resultat.style.color = "red";
        }
      } catch (err) {
        resultat.textContent = "❌ ERREUR RÉSEAU : " + err.message;
        resultat.style.color = "red";
      }
    }
  </script>
</body>
</html>
