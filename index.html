<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Arial', sans-serif; }
  body { background:#f0f2f5; padding:10px; }
  .bon { max-width:800px; margin:auto; background:#fff; padding:12px 18px;
    border-radius:6px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }

  /* EN-TÊTE ENCORE PLUS COMPACT */
  .header { display:flex; justify-content:space-between; align-items:center;
    border-bottom:2px solid #1e3c72; padding-bottom:6px; margin-bottom:8px;
    gap:12px; }
  .header-logo { display:flex; align-items:center; gap:10px; }
  .header-logo img { height:45px; width:45px; object-fit:contain; }
  .header-info h1 { color:#1e3c72; font-size:16px; margin-bottom:1px; }
  .header-info .subtitle { color:#444; font-size:10px; font-weight:600; }
  .header-info .slogan { color:#888; font-size:8.5px; font-style:italic;
    margin-top:1px; letter-spacing:0.3px; }
  .header-right { text-align:right; }
  .bon-num { font-size:11px; color:#1e3c72; font-weight:bold;
    background:#e8f0fb; padding:4px 10px; border-radius:4px;
    display:inline-block; margin-bottom:3px; }
  .date-creation { font-size:8px; color:#888; display:block; }

  /* TITRE */
  .titre-bon { text-align:center; color:#1e3c72; font-size:12px;
    font-weight:bold; letter-spacing:1.5px; background:#f8f9fb;
    padding:5px; border-radius:4px; margin-bottom:8px;
    border-left:3px solid #1e3c72; }

  /* SECTIONS */
  .section { margin-bottom:6px; page-break-inside:avoid; }
  .section-titre { background:#1e3c72; color:#fff; padding:3px 8px;
    font-size:9.5px; font-weight:bold; letter-spacing:0.8px;
    border-radius:3px; margin-bottom:3px; }

  /* LIGNES ULTRA COMPACTES */
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:0 15px; }
  .ligne { display:flex; padding:1.5px 0; border-bottom:1px dotted #e0e0e0;
    font-size:10px; line-height:1.2; }
  .ligne:last-child { border-bottom:none; }
  .ligne .label { width:110px; color:#666; font-size:9.5px; font-weight:500; }
  .ligne .valeur { flex:1; color:#111; font-size:10px; font-weight:600;
    word-break:break-word; }

  /* MOTIF */
  .motif-box { background:#f8f9fb; padding:5px 8px; border-radius:3px;
    border-left:3px solid #1e3c72; font-size:9.5px; color:#333;
    line-height:1.3; white-space:pre-wrap; max-height:45px; overflow:hidden; }

  /* SIGNATURES */
  .signatures { display:flex; justify-content:space-between;
    gap:20px; margin-top:12px; page-break-inside:avoid; }
  .signature-bloc { flex:1; text-align:center; }
  .signature-titre { font-size:9.5px; font-weight:bold; color:#333;
    margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px; }
  .signature-sous-titre { font-size:8.5px; color:#888; margin-bottom:28px; }
  .signature-ligne { border-top:1px solid #333; padding-top:3px;
    font-size:8px; color:#666; min-height:35px; }

  /* PIED */
  .footer { margin-top:8px; padding-top:5px; border-top:1px solid #ddd;
    text-align:center; font-size:7.5px; color:#999; line-height:1.3; }
  .footer strong { color:#1e3c72; }

  /* BOUTON */
  .btn-print-now { display:block; margin:12px auto 0; background:#1e3c72;
    color:#fff; padding:9px 22px; border:none; border-radius:6px;
    font-size:12px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 12px rgba(30,60,114,0.3); }
  .btn-print-now:hover { background:#2a5298; }

  /* ⚠️ IMPRESSION : HAUTEUR FIXE A4 */
  @media print {
    html, body { background:#fff; padding:0; margin:0;
      width:210mm; height:297mm; }
    .bon { box-shadow:none; padding:8mm 10mm; max-width:100%;
      width:100%; min-height:281mm; max-height:281mm;
      overflow:hidden; page-break-after:avoid;
      display:flex; flex-direction:column; }
    .btn-print-now { display:none; }
    @page { size:A4 portrait; margin:8mm; }
    * { -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important; color-adjust:exact !important; }
  }
</style>
