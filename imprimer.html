<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impression Ordre de Mission - ONG ADKOUL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  body { font-family: 'Times New Roman', Times, serif; background: #f0f2f5; margin: 0; padding: 20px; }
  .document { background: #fff; max-width: 800px; margin: 0 auto; padding: 20px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #000; line-height: 1.4; }
  
  /* En-tête */
  .entete-document { width: 100%; height: auto; display: block; margin-bottom: 20px; }

  .header h1 { font-size: 22px; font-weight: bold; margin: 10px 0 5px 0; text-align: center; text-transform: uppercase; }
  .header h2 { font-size: 14px; font-weight: normal; margin: 0 0 15px 0; text-align: center; }
  .titre-om { text-align: center; font-size: 18px; font-weight: bold; margin: 20px 0 20px 0; text-transform: uppercase; text-decoration: underline; }
  .bureau { font-weight: bold; margin-bottom: 15px; font-size: 16px; }
  .contenu { font-size: 15px; line-height: 1.6; }
  .contenu p { margin-bottom: 15px; font-weight: bold; text-transform: uppercase; }
  
  /* Mise en page des lignes */
  .ligne { margin-bottom: 10px; display: flex; align-items: flex-end; }
  .label { font-weight: bold; width: 220px; flex-shrink: 0; text-transform: uppercase; font-size: 14px; }
  .valeur { flex-grow: 1; border-bottom: 1px dotted #000; padding-left: 10px; font-size: 15px; }
  
  /* Signatures */
  .footer-page1 { margin-top: 30px; display: flex; justify-content: space-between; }
  .bloc-signature { text-align: center; width: 250px; }
  .bloc-signature p { margin-bottom: 5px; font-weight: bold; font-size: 14px; }
  .espace-signature { height: 60px; }

  @media print {
    body { background: #fff; padding: 0; margin: 0; }
    .document { box-shadow: none; padding: 0; max-width: 100%; }
    .actions-buttons { display: none !important; }
    @page { size: A4 portrait; margin: 15mm; }
    .page-2 { page-break-before: always; }
  }

  /* Page 2 (Cadres de visas) */
  .page-2 { margin-top: 30px; }
  .cadre-signature { border: 1px solid #000; padding: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 13px; page-break-inside: avoid; height: 140px; box-sizing: border-box; }
  .colonne-signature { width: 48%; display: flex; flex-direction: column; justify-content: space-between; }
  .ligne-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .ligne-milieu { display: flex; gap: 5px; margin-bottom: 10px; }
  .ligne-bas { display: flex; gap: 5px; }
  
  /* Boutons */
  .actions-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
  .btn { padding: 12px 25px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; font-family: sans-serif; }
  .btn-print { background: #27ae60; }
  .btn-print:hover { background: #229954; }
  .btn-download { background: #1e3c72; }
  .btn-download:hover { background: #2a5298; }
</style>
</head>
<body>

<div class="document" id="documentContent">
  <p style="text-align: center; color: #666; padding: 50px; font-family: sans-serif;">⏳ Chargement des données...</p>
</div>

<div class="actions-buttons" id="actionButtons" style="display: none;">
  <button class="btn btn-print" onclick="window.print()">🖨️ Imprimer</button>
  <button class="btn btn-download" id="btnDownloadPdf">📥 Télécharger en PDF</button>
</div>

<script>
  const SUPABASE_URL = "https://mvmzhdvkeromtljnvrow.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Wd7mDCVh2xZd-mjUxWFxPQ_tjJkdsdh";

  const contenu = document.getElementById("documentContent");
  const actionButtons = document.getElementById("actionButtons");
  const escapeHtml = value => String(value ?? "—").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  
  function refuser(texte) {
    contenu.innerHTML = `<p style="text-align: center; color: red;">${texte}</p>`;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const ordreId = urlParams.get('id');
  const autoDownload = urlParams.get('download') === 'true';

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleDateString('fr-FR');
  }

  async function consulter() {
    if (!ordreId) { refuser("Aucun identifiant fourni dans le lien."); return; }

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/missions_2?id=eq.${encodeURIComponent(ordreId)}&select=*`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        },
        cache: "no-store"
      });

      if (!response.ok) throw new Error("Erreur de connexion à la base de données.");
      const data = await response.json();

      if (data && data.length > 0) {
        const d = data[0];
        
        // LE LIEN POINTE MAINTENANT VERS VOTRE FICHIER entete.png
        const lienEntete = "https://amague2007-star.github.io/demande-vehicule/entete.png"; 

        document.getElementById('documentContent').innerHTML = `
          <!-- L'EN-TÊTE -->
          <img src="${lienEntete}" alt="En-tête ONG ADKOUL" class="entete-document" crossorigin="anonymous">
          
          <div class="header">
            <h1>ORDRE DE MISSION</h1>
            <h2>Référence : ${escapeHtml(d.id)}</h2>
          </div>
          
          <div class="titre-om">DEMANDE D'ORDRE DE MISSION</div>
          
          <div class="bureau">Bureau : ${escapeHtml(d.bureau)}</div>
          
          <div class="contenu">
            <p>LE SECRETAIRE EXECUTIF DE L'ONG ADKOUL AUTORISE :</p>
            
            <div class="ligne"><span class="label">CHEF DE MISSION :</span> <span class="valeur">${escapeHtml(d.nom)}</span></div>
            <div class="ligne"><span class="label">EMPLOI OCCUPE :</span> <span class="valeur">${escapeHtml(d.poste)}</span></div>
            <div class="ligne"><span class="label">ACCOMPAGNATEURS :</span> <span class="valeur">${escapeHtml(d.accompagnateurs || '—')}</span></div>
            <div class="ligne"><span class="label">DESTINATION :</span> <span class="valeur">${escapeHtml(d.destination)}</span></div>
            <div class="ligne"><span class="label">OBJECTIF :</span> <span class="valeur">${escapeHtml(d.objectif)}</span></div>
            <div class="ligne"><span class="label">MOYEN DE DEPLACEMENT :</span> <span class="valeur">${escapeHtml(d.moyen_deplacement)}</span></div>
            <div class="ligne"><span class="label">CHAUFFEUR :</span> <span class="valeur">${escapeHtml(d.chauffeur_assigne || '—')}</span></div>
            <div class="ligne"><span class="label">VÉHICULE :</span> <span class="valeur">${escapeHtml(d.vehicule_assigne || '—')}</span></div>
            <div class="ligne"><span class="label">DATE DE DEPART :</span> <span class="valeur">${formatDate(d.date_depart)}</span></div>
            <div class="ligne"><span class="label">DATE DE RETOUR :</span> <span class="valeur">${formatDate(d.date_retour)}</span></div>
            <div class="ligne"><span class="label">IMPUTATION BUDGETAIRE :</span> <span class="valeur">${escapeHtml(d.imputation_budgetaire)}</span></div>
          </div>

          <div class="footer-page1">
            <div class="bloc-signature">
              <p>Fait à ${escapeHtml(d.bureau)}, le ${formatDate(d.date_depart)}</p>
            </div>
            <div class="bloc-signature">
              <p>LE SECRETAIRE EXECUTIF</p>
              <div class="espace-signature"></div>
            </div>
          </div>

          <!-- PAGE 2 (Visas) -->
          <div class="page-2">
            ${Array(4).fill(`
            <div class="cadre-signature">
              <div class="colonne-signature">
                <div>
                  <div class="ligne-top"><span>Lieu : ..................................</span><span>Date de départ : ....../....../2026</span></div>
                  <div class="ligne-milieu"><span>Autorité : ..................................</span></div>
                </div>
                <div class="ligne-bas"><span>Visa : ..................................</span></div>
              </div>
              <div class="colonne-signature">
                <div>
                  <div class="ligne-top"><span>Lieu : ..................................</span><span>Date d'arrivée : ....../....../2026</span></div>
                  <div class="ligne-milieu"><span>Autorité : ..................................</span></div>
                </div>
                <div class="ligne-bas"><span>Visa : ..................................</span></div>
              </div>
            </div>
            `).join('')}
          </div>
        `;
        
        actionButtons.style.display = 'flex';

        // Fonction pour télécharger le PDF
        document.getElementById('btnDownloadPdf').addEventListener('click', () => {
          const element = document.getElementById('documentContent');
          
          const opt = {
            margin:       [10, 10, 10, 10], 
            filename:     `Ordre_Mission_${d.nom.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 1 },
            html2canvas:  { scale: 2, useCORS: true, scrollY: 0 }, 
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          html2pdf().set(opt).from(element).save();
        });

        // Téléchargement automatique si on vient du bouton "Télécharger" de l'admin
        if (autoDownload) {
          setTimeout(() => {
            document.getElementById('btnDownloadPdf').click();
          }, 1500); 
        }

      } else {
        refuser("Erreur : Ordre de mission introuvable dans la base de données.");
      }
    } catch (err) {
      refuser("Erreur : " + err.message);
    }
  }

  consulter();
</script>

</body>
</html>
